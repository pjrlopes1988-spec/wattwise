# Wattwise — parâmetros do motor e das métricas.
# Valores por defeito da ESPECIFICACAO.md. O Paulo valida e ajusta.
# Qualquer alteração muda a versão (hash) registada em cada decisão do motor.

potencia:
  # Limite superior de cada zona em % do FTP (inclusivo). Z7 não tem limite. (D-007)
  zonas_coggan_limites_pct: [55, 75, 90, 105, 120, 150]
  np_janela_s: 30
  curva_duracoes_s: [5, 60, 300, 1200, 3600]

frequencia_cardiaca:
  # Friel, ciclismo: limite superior de cada zona em % da FC limiar (D-013)
  zonas_friel_limites_pct: [81, 89, 93, 99, 102, 106]
  zonas_friel_nomes: [Z1, Z2, Z3, Z4, Z5a, Z5b, Z5c]
  # Coeficiente b do TRIMP de Banister (o fator 'a' anula-se na normalização) (D-011)
  hrss_b_masculino: 1.92
  hrss_b_feminino: 1.67
  desacoplamento_bom_pct: 5.0

carga_forma:
  constante_condicao_dias: 42
  constante_fadiga_dias: 7
  # "linear": x/42 (como na spec); "exponencial": 1 - e^(-1/42) (D-008)
  fator_media: linear
  # Abaixo desta Condição a forma em % não é calculada ("a calibrar") (D-009)
  condicao_minima_para_pct: 15
  # Último recurso sem potência nem FC: carga = RPE x min x 100 / (rpe_limiar x 60) (D-021)
  rpe_limiar: 7
  faixas_frescura_pct:
    transicao_acima: 25
    fresco_acima: 5
    neutra_acima: -10
    otima_acima: -30   # abaixo disto: risco elevado

modelo_potencia_critica:
  duracao_minima_esforco_s: 300
  duracao_maxima_esforco_s: 1800
  # FTP = CP x fator. A VALIDAR pelo Paulo e na comparação com o Intervals.icu (D-010)
  ftp_fator_cp: 1.0
  # Valores de população para o ajuste com um único esforço, sem histórico (D-010). A VALIDAR.
  populacao:
    w_linha_j: 15000
    pmax_w_por_kg: 14.0

eftp:
  # morton_1_esforco (por defeito) | morton_3p | monod_2p  (spec 6.1)
  metodo: morton_1_esforco
  # Durações (s) guardadas na curva de cada atividade para os modelos
  duracoes_curva_s: [5, 10, 15, 30, 60, 120, 180, 240, 300, 420, 600, 900, 1200, 1500, 1800]
  # W' e Pmax do próprio atleta: ajuste de 3 parâmetros aos melhores esforços desta janela
  janela_perfil_dias: 90
  w_linha_plausivel_j: [5000, 40000]   # fora disto usa-se a população
  perfil_minimo_atividades: 3          # esforços de pelo menos 3 atividades diferentes
  # eFTP com histórico: sem esforços comparáveis, desce devagar (D-023). A VALIDAR.
  decaimento_carencia_dias: 28
  decaimento_pct_por_semana: 0.5
  # Subidas acima disto precisam de 2.º esforço (outra atividade) ou de treinos de limiar cumpridos
  subida_sem_confirmacao_max_pct: 3.0
  alteracao_minima_pct: 1.0      # abaixo disto não se incomoda o atleta
  dias_para_resposta: 3          # depois: aplica descidas, nunca subidas
  # Proteção contra descidas por sessões não máximas (D-034)
  descida_minimo_dias_dados: 42  # sem 6 semanas de dados de potência na app, não se propõem descidas
  descida_max_pct: 5.0           # cada proposta desce no máximo 5%
  fator_teste_20min: 0.95

qualidade:
  potencia_maxima_plausivel_w: 2500
  fc_minima_plausivel: 30
  fc_folga_acima_fc_max: 5        # bpm acima da FC máx. do atleta = pico
  fc_salto_maximo_bpm_por_s: 25
  cadencia_minima_falha_potencia: 30  # potência 0 com cadência acima disto = falha de sinal
  pausa_minima_s: 10                 # intervalo sem registos maior que isto = pausa
  indice_minimo_para_modelos: 0.9    # eFTP, W' e modelos personalizados
  penalizacao_fc_otica: 0.1
  # Atividades suspeitas (excluídas do eFTP até o atleta confirmar) (D-028)
  velocidade_motorizada_ms: 20.0         # 72 km/h...
  velocidade_motorizada_min_s: 60        # ...mantidos durante 60 s seguidos
  eficiencia_desvio_suspeito_pct: 20     # potência/FC muito diferente do habitual do atleta
  curva_salto_suspeito_pct: 25           # melhor potência muito acima do melhor da época

intervalos:
  # Deteção automática (sem depender do botão de volta) (D-029)
  limiar_pct_ftp: 76          # trabalho = potência suavizada >= 76% do FTP (início da Z3)
  saida_pct_ftp: 70           # ...e só acaba abaixo de 70% (histerese: oscilações não partem o intervalo)
  limiar_pct_fc_limiar: 92    # sem potência: FC >= 92% da FC limiar
  saida_pct_fc_limiar: 88
  suavizacao_s: 10
  duracao_minima_s: 30
  juntar_pausas_ate_s: 10     # quedas curtas dentro do mesmo intervalo
  recuperacao_fc_s: 60        # HRRc: descida da FC 60 s após o fim

seiler:
  # Zona mais alta (de 7) incluída em "baixa" e em "limiar"; acima = "alta" (D-014)
  potencia_ultima_zona: [2, 4]
  fc_ultima_zona: [2, 4]

recuperacao:
  # VFC (spec 6.4): média de 7 dias comparada com a faixa normal dos últimos 60 dias (D-026)
  vfc_janela_media_dias: 7
  vfc_minimo_valores_na_media: 4     # menos medições na semana → sem estado
  vfc_janela_faixa_dias: 60
  vfc_largura_faixa_dp: 1.0          # faixa = média ± 1,0 desvio-padrão. A VALIDAR.
  vfc_dias_calibracao: 14            # antes disto: "a calibrar", o motor não usa a VFC
  # FC de repouso: mesma abordagem; "elevada" = média de 7 dias acima da faixa
  fcr_largura_faixa_dp: 1.0
  fcr_dias_elevada_alerta: 3         # dias seguidos elevada → sinal de alerta
  sono_curto_h: 6.0

dados:
  # Mesma atividade por duas vias (spec 5): início ± 2 min e duração semelhante (D-030)
  dedup_inicio_tolerancia_s: 120
  dedup_duracao_tolerancia_pct: 10

modelo_fc_personalizado:
  # Carga por FC aprendida com as atividades do atleta com potência e FC (spec 6.2) (D-031)
  minimo_atividades: 20
  r2_minimo: 0.8
  janela_dias: 180

# ------------------------------------------------------------------ Fase 2: perfil e plano
perfil:
  idade_minima: 10                 # pedido do Paulo (19/11/2026); a spec tinha 18 (D-045)
  idade_consentimento_proprio: 14  # abaixo disto: consentimento de um responsável legal (PT 13, ES 14). Jurista.
  idade_adulto: 18                 # abaixo disto: regras de treino de iniciante, seja qual for o nível
  # Valores conservadores quando o atleta não sabe (marcados "estimado"; teste guiado na 1.ª semana) (D-042)
  ftp_w_kg_estimado: {iniciante: 2.0, intermedio: 2.6, avancado: 3.2, competicao: 3.8}
  fator_ftp_feminino: 0.88
  fc_limiar_fator_fc_max: 0.90     # FC limiar ≈ 90% da FC máxima
  fc_repouso_estimada: 60
  # Ciclo "automático": 2+1 a partir desta idade (recuperação mais lenta), 3+1 abaixo (D-061)
  idade_ciclo_2_1: 50

plano:
  # Subida máxima da Condição por semana (spec 7.3) (D-043)
  rampa_condicao_semana: {iniciante: 5, intermedio: 6, avancado: 7, competicao: 8}
  semanas_carga_por_ciclo: 3            # 3 de carga + 1 de recuperação (spec 7.2)
  fator_semana_recuperacao: 0.60        # carga da semana de recuperação vs. última de carga
  fator_afinacao: 0.55                  # carga da semana de afinação vs. última de carga
  semanas_base_arranque_frio: 3         # atleta sem histórico (spec 7.6)
  semanas_especifico: 4
  semanas_construcao_max: 8
  semanas_afinacao_prova_longe: 2       # prova a 12+ semanas
  semanas_prova_longe: 12
  horizonte_sem_prova_semanas: 12
  carga_prova_estimada: 100
  sessoes_chave:
    base: {iniciante: 0, intermedio: 1, avancado: 1, competicao: 1}
    construcao: {iniciante: 1, intermedio: 2, avancado: 2, competicao: 2}
    especifico: {iniciante: 1, intermedio: 2, avancado: 2, competicao: 2}
    recuperacao: {iniciante: 0, intermedio: 0, avancado: 0, competicao: 0}
    afinacao: {iniciante: 1, intermedio: 1, avancado: 1, competicao: 1}
  tipos_por_fase:
    base: [tempo, forca, sweetspot]
    construcao: [sweetspot, limiar]
    afinacao: [vo2max]
    especifico:
      estrada: [limiar, vo2max]
      gravel: [sweetspot, limiar]
      btt_xco: [vo2max, anaerobio]
      btt_maratona: [sweetspot, limiar]
      contrarrelogio: [limiar, sweetspot]
  dificuldade_max: {iniciante: 2, intermedio: 3, avancado: 4, competicao: 5}
  dias_descanso_min: {iniciante: 2, intermedio: 1, avancado: 1, competicao: 1}
  max_dias_alta_intensidade_seguidos: 2  # spec 7.3
  tipos_alta_intensidade: [limiar, vo2max, anaerobio, teste]
  # ...e qualquer treino (ex.: força) com estes tempos de trabalho intenso (D-049)
  alta_intensidade_s_acima_95pct: 300
  alta_intensidade_s_acima_120pct: 60
  duracao_minima_sessao_chave_min: 45
  duracao_minima_treino_min: 30
  arredondar_min: 15
  fracao_carga_dia_longo: 0.4           # parte da carga de resistência que vai para o dia longo
  duracao_minima_resistencia_min: 60    # em semanas de carga: menos treinos de resistência, mas de pelo menos 60 min (D-051)

indoor:
  # Bibliotecas separadas indoor/outdoor; o atleta escolhe onde treina (D-058)
  duracao_max_min: 150      # treinos mais longos só existem na biblioteca outdoor

provas:
  # Provas com prioridade A (objetivo) a D (prova-treino) (D-060)
  semanas_recuperacao_apos_A: 1
  fator_carga_semana_B: 0.8          # mini-afinação: carga da semana da prova B
  dias_sem_intensidade_antes: {A: 0, B: 3, C: 1, D: 0}   # A: a afinação já trata disto
  dias_faceis_depois: {A: 2, B: 1, C: 0, D: 0}           # recuperação (≤ 45 min) ou descanso
  duracao_max_antes_min: 60          # nos dias sem intensidade antes da prova: treinos curtos e fáceis
  ativacao_antes: {A: false, B: true, C: false, D: false}   # ativação curta 1–2 dias antes (a A já a tem na afinação)
  etapas_max_dias: 7                 # provas por etapas: da 1.ª à última etapa — por norma até 1 semana (D-062)
  # Depois da recuperação a seguir a uma prova A, o motor diário (Fase 3) avalia a prontidão antes de
  # retomar a carga; se o atleta não estiver pronto, prolonga a recuperação até este limite (D-063)
  prolongar_recuperacao_max_semanas: 1
  conta_como_sessao_chave: {A: true, B: true, C: true, D: true}
  duracao_por_defeito_h: 2.0
  # intensidade média estimada pela duração da prova (h → IF); carga = h × IF² × 100
  intensidade_por_duracao: [[1.0, 0.95], [2.0, 0.88], [3.0, 0.82], [5.0, 0.76], [24.0, 0.70]]
