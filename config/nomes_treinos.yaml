# Nomes de marca dos treinos Wattwise (D-050). O Paulo pode mudar à vontade.
# Na app aparece "Nome · descrição técnica" (ex.: "Angliru · Limiar 2 × 20 min").
#
# Famílias (o nome diz o tipo de treino):
#   Rios            → resistência e recuperação
#   Serras          → tempo e sweet spot
#   Subidas míticas → limiar
#   Ventos          → VO2máx e anaeróbio
#   Castelos        → força (cadência baixa)
#   Faróis          → testes

