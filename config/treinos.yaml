# Biblioteca inicial de treinos — Wattwise (D-044)
# PROVISÓRIA: o Paulo valida, corrige e acrescenta (spec 13).
#
# Cada treino: id, nome, tipo, dificuldade (1–5) e passos.
# Passo: {min: duração, pct: [mín, máx] em % do FTP, cadencia: [mín, máx] (opcional)}
# Bloco repetido: {repetir: N, passos: [...]}
# Treinos de resistência/recuperação com "escalavel: true": o passo marcado com
# "escala: true" estica ou encolhe para caber no tempo pedido pelo plano.
#
# Tipos: recuperacao, resistencia, tempo, forca, sweetspot, limiar, vo2max, anaerobio, teste

- id: recuperacao
  nome: Recuperação ativa
  tipo: recuperacao
  dificuldade: 1
  escalavel: true
  passos:
    - {min: 30, pct: [45, 55], escala: true}

- id: resistencia
  nome: Resistência Z2
  tipo: resistencia
  dificuldade: 1
  escalavel: true
  passos:
    - {min: 10, pct: [50, 60]}
    - {min: 40, pct: [62, 72], escala: true}
    - {min: 10, pct: [50, 60]}

- id: tempo_3x10
  nome: Tempo 3 × 10 min
  tipo: tempo
  dificuldade: 2
  passos:
    - {min: 15, pct: [55, 70]}
    - repetir: 3
      passos:
        - {min: 10, pct: [76, 85]}
        - {min: 5, pct: [50, 60]}
    - {min: 10, pct: [50, 60]}

