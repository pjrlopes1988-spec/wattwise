[project]
name = "wattwise-backend"
version = "0.1.0"
description = "Wattwise: API (FastAPI) que liga o motor (wattwise-core) à app"
requires-python = ">=3.12"
dependencies = ["wattwise-core", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
